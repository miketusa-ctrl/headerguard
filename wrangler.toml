# Public template. Replace every <PLACEHOLDER> with your own Cloudflare resource IDs
# (wrangler kv namespace create / wrangler d1 create). Rate-limit namespace IDs must be
# unique integers within your account. Secrets go in `wrangler secret put`, never here.

name = "headerguard"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true
preview_urls = false

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.txt"]
fallthrough = true

[vars]
PUBLIC_LAUNCH = "true"
SCAN_LIMIT_PER_MIN = "30"
PRO_SCAN_LIMIT_PER_MIN = "120"
PRO_CHECKOUT_URL = "https://buy.polar.sh/polar_cl_isRRVJTATDI60ftjw6GnmlDneRdw46fI2cQcm0n6pnD"
PRO_PORTAL_URL = "https://polar.sh/digital-promo/portal"
MCP_REGISTRY_AUTH = ""

[[unsafe.bindings]]
name = "SCAN_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_1>"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "PRO_SCAN_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_2>"
simple = { limit = 120, period = 60 }

[[unsafe.bindings]]
name = "RAPIDAPI_BASIC_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_3>"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "RAPIDAPI_PRO_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_4>"
simple = { limit = 120, period = 60 }

[[kv_namespaces]]
binding = "HEADERGUARD_KV"
id = "<KV_NAMESPACE_ID>"

[[kv_namespaces]]
binding = "LICENSES"
id = "<KV_NAMESPACE_ID>"
preview_id = "<KV_PREVIEW_NAMESPACE_ID>"

[version_metadata]
binding = "CF_VERSION_METADATA"

[limits]
cpu_ms = 100

[env.preview]
workers_dev = true
preview_urls = false

[env.preview.vars]
PUBLIC_LAUNCH = "false"
SCAN_LIMIT_PER_MIN = "30"
PRO_SCAN_LIMIT_PER_MIN = "120"
PRO_CHECKOUT_URL = "https://buy.polar.sh/polar_cl_isRRVJTATDI60ftjw6GnmlDneRdw46fI2cQcm0n6pnD"
PRO_PORTAL_URL = "https://polar.sh/digital-promo/portal"
MCP_REGISTRY_AUTH = ""

[env.preview.limits]
cpu_ms = 100

[env.preview.version_metadata]
binding = "CF_VERSION_METADATA"

[[env.preview.kv_namespaces]]
binding = "LICENSES"
id = "<PREVIEW_KV_NAMESPACE_ID>"
preview_id = "<PREVIEW_KV_PREVIEW_NAMESPACE_ID>"

[[env.preview.unsafe.bindings]]
name = "SCAN_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_5>"
simple = { limit = 30, period = 60 }

[[env.preview.unsafe.bindings]]
name = "PRO_SCAN_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_6>"
simple = { limit = 120, period = 60 }

[[env.preview.unsafe.bindings]]
name = "RAPIDAPI_BASIC_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_7>"
simple = { limit = 10, period = 60 }

[[env.preview.unsafe.bindings]]
name = "RAPIDAPI_PRO_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_8>"
simple = { limit = 120, period = 60 }

[[env.preview.kv_namespaces]]
binding = "HEADERGUARD_KV"
id = "<PREVIEW_KV_NAMESPACE_ID>"
